name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Build recipes.json from every recipes/*.md (title = first "# " heading).
      - name: Generate recipe index
        run: |
          python3 - <<'EOF'
          import json, pathlib, re
          out = []
          for p in sorted(pathlib.Path('recipes').glob('*.md')):
              m = re.search(r'^#\s+(.+)$', p.read_text(encoding='utf-8'), re.M)
              out.append({'slug': p.stem, 'title': m.group(1).strip() if m else p.stem})
          pathlib.Path('recipes.json').write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'{len(out)} recipes')
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
